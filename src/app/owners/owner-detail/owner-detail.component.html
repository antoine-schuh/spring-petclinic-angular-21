<div class="container-fluid">
  <div class="container xd-container">

    <h2>Owner Information</h2>


    <table class="table">
      <tr>
        <th>Name</th>
        <td><b class="ownerFullName">{{ owner().firstName }} {{ owner().lastName }}</b></td>
      </tr>
      <tr>
        <th>Address</th>
        <td>{{ owner().address }}</td>
      </tr>
      <tr>
        <th>City</th>
        <td>{{ owner().city }}</td>
      </tr>
      <tr>
        <th>Telephone</th>
        <td>{{ owner().telephone }}</td>
      </tr>
    </table>

    <button class="btn btn-secondary" (click)="gotoOwnersList()">Back</button>
    <button class="btn btn-secondary" (click)="editOwner()">Edit Owner</button>
    <button class="btn btn-secondary" (click)="addPet(owner())">Add New Pet</button>

    <br />
    <br />
    <br />
    <h2>Pets and Visits</h2>

    <table class="table">
      <tr>
        @for (pet of owner().pets; track pet) {
          <app-pet-list [pet]="pet"></app-pet-list>
        }
      </tr>
    </table>
  </div>
</div>
