<table [hidden]="deleteSuccess()" class="table">
  <tr>
    <td valign="top">
      <dl class="dl-horizontal">
        <dt>Name</dt>
        <dd>{{ pet().name }}</dd>
        <dt>Birth Date</dt>
        <dd>{{ pet().birthDate }}</dd>
        <dt>Type</dt>
        @if (!deleteSuccess()) {
          <dd>{{ pet().type.name }}</dd>
        }
        <button class="btn btn-secondary" (click)="editPet(pet())">Edit Pet</button>
        <button class="btn btn-secondary" (click)="deletePet(pet())">Delete Pet</button>
        <button class="btn btn-secondary" (click)="addVisit(pet())">Add Visit</button>

      </dl>
    </td>
    <td valign="top">
      <app-visit-list [visits]="pet().visits"></app-visit-list>
    </td>
  </tr>

</table>
